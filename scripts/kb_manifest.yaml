# Hello-Agents 知识库 · 实验索引清单
# 被 scripts/gen_kb_index.py 消费，生成 kb/实验/ 下的索引卡（幂等，可重跑）。
# 字段说明：
#   chapter     章号（1-16）
#   title/doc   章节短标题 / docs 正文文件名（不含 .md）
#   icon        ✅ 已跑通 / 📖 待复现（章级默认，实验可覆盖）
#   experiments/projects:
#     code       编号，如 "4-1"
#     name       实验名（笔记名 = "实验 4-1 · <name>"）
#     desc       一句话说明
#     dir        源码目录（相对仓库根，默认 code/chapter<N>）
#     files      源码文件（相对 dir）；目录以 / 结尾则渲染为代码样式
#     concepts   相关概念卡（wikilink 目标）
#     status     未开始/进行中/已完成（默认 未开始）
#     icon       覆盖章级 icon

chapters:
